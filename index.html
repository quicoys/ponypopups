<!doctype html>
<html>
<head>
  <title>Flutterz</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff7fb;
    }

    #status {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      font-family: sans-serif;
      background: white;
      padding: 6px 10px;
      border-radius: 8px;
    }

    #preview {
      width: 100vw;
      height: 100vh;
      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>
  <p id="status"></p>
  <img id="preview" alt="Fluttershy preview">

  <script>
    var maxWindows = 5;

    function getOpenWindowCount() {
      return Number(localStorage.getItem("flutterzOpenWindows") || "0");
    }

    function setOpenWindowCount(count) {
      localStorage.setItem("flutterzOpenWindows", String(Math.max(0, count)));
    }

    function registerThisWindow() {
      if (!sessionStorage.getItem("flutterzRegistered")) {
        sessionStorage.setItem("flutterzRegistered", "true");
        setOpenWindowCount(getOpenWindowCount() + 1);
      }
    }

    function unregisterThisWindow() {
      if (sessionStorage.getItem("flutterzRegistered")) {
        sessionStorage.removeItem("flutterzRegistered");
        setOpenWindowCount(getOpenWindowCount() - 1);
      }
    }

    document.addEventListener("click", musicPlay);

    var faudio = new Audio("https://archive.org/download/wayfarer-processed-fordemo/wayfarer.mp3");

    function musicPlay() {
      faudio.play().catch(function(error) {
        console.log("Audio could not play:", error);
      });
    }

    faudio.addEventListener("timeupdate", function() {
      if (this.currentTime > this.duration - 0.45) {
        this.currentTime = 0;
        this.play();
      }
    });

    function bookmark() {
      if (
        navigator.appName == "Microsoft Internet Explorer" &&
        parseInt(navigator.appVersion) >= 4
      ) {
        var url = "neigh.html";
        var title = "Flutterz";
        window.external.AddFavorite(url, title);
      }
    }

    var xOff = 5;
    var yOff = 5;
    var xPos = 400;
    var yPos = -100;
    var flagRun = 1;

    function changeTitle(title) {
      document.title = title;
    }

    function newXlt() {
      xOff = Math.ceil(-6 * Math.random()) * 5 - 10;
      window.focus();
    }

    function newXrt() {
      xOff = Math.ceil(7 * Math.random()) * 5 - 10;
      window.focus();
    }

    function newYup() {
      yOff = Math.ceil(-6 * Math.random()) * 5 - 10;
      window.focus();
    }

    function newYdn() {
      yOff = Math.ceil(7 * Math.random()) * 5 - 10;
      window.focus();
    }

    function fOff() {
      flagRun = 0;
    }

    function playBall() {
      xPos += xOff;
      yPos += yOff;

      if (xPos > screen.width - 357) newXlt();
      if (xPos < 0) newXrt();

      if (yPos > screen.height - 330) newYup();
      if (yPos < 0) newYdn();

      if (flagRun == 1) {
        window.moveTo(xPos, yPos);
        setTimeout(playBall, 1);
      }
    }

    async function getRandomFluttershyImage() {
      const query = encodeURIComponent("fluttershy, safe");
      const url = `https://derpibooru.org/api/v1/json/search/images?q=${query}&sf=random&per_page=3`;

      const response = await fetch(url, {
        headers: {
          "Accept": "application/json"
        }
      });

      if (!response.ok) {
        throw new Error(`Derpibooru API error: ${response.status}`);
      }

      const data = await response.json();

      if (!data.images || data.images.length === 0) {
        throw new Error("No images found.");
      }

      const image = data.images[0];

      return image.representations?.large
        || image.representations?.medium
        || image.view_url
        || image.image;
    }

    async function loadFluttershyImage() {
      const status = document.getElementById("status");
      const preview = document.getElementById("preview");

      try {
        status.textContent = "Loading...";

        const imageUrl = await getRandomFluttershyImage();

        preview.src = imageUrl;
        status.textContent = "";
      } catch (error) {
        status.textContent = error.message;
        console.error(error);
      }
    }

    function openWindow(url) {
      var currentCount = getOpenWindowCount();

      if (currentCount >= maxWindows) {
        console.log("Max windows reached:", currentCount);
        return null;
      }

      return window.open(
        url,
        "_blank",
        "menubar=no, status=no, toolbar=no, resizable=no, width=357, height=330, titlebar=no"
      );
    }

    function proCreate() {
      for (var i = 0; i < 1; i++) {
        openWindow("index.html");
      }
    }

    window.onload = function() {
      registerThisWindow();

      flagRun = 1;

      loadFluttershyImage();
      playBall();
      bookmark();

      return true;
    };

    window.addEventListener("beforeunload", function() {
      unregisterThisWindow();
    });

    window.onmouseout = function() {
      proCreate();
      return null;
    };

    window.oncontextmenu = function() {
      return false;
    };

    window.onkeydown = function(e) {
      var keyCode = e.keyCode;

      if (
        keyCode == 17 ||
        keyCode == 18 ||
        keyCode == 46 ||
        keyCode == 115
      ) {
        alert("Flutterz");
        alert("Flutterz");
        alert("Flutterz");
        alert("Flutterz");
        alert("Flutterz");
        alert("Flutterz");
        alert("Flutterz");
        alert("Flutterz");
        alert("Flutterz");

        alert("!");
        alert("!");
        alert("!");
        alert("!");
        alert("!");
        alert("!");
        alert("!");
        alert("!");
        alert("!");
        alert("!");
        alert("!");

        proCreate();
      }

      return null;
    };

    window.onbeforeunload = function() {
      return "Flutterz";
    };
  </script>
</body>
</html>
